name: scene
on:
  push:
    paths: ['scene/req.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fonttools brotli requests pillow "rembg[cpu]" onnxruntime
      - run: python scene/fetch.py
      - run: |
          git config user.name "scene-bot"
          git config user.email "scene-bot@users.noreply.github.com"
          git add scene
          git commit -m "Scene assets" || echo "nothing to commit"
          git pull --rebase
          git push
